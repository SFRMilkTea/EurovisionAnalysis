<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Еврокомиссия</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
<main class="container" style="max-width: 28rem; margin-top: 10vh;">
    <article>
        <h1>Еврокомиссия</h1>
        <p>Войдите, чтобы посмотреть и заполнить оценки.</p>
        {% if error %}<p style="color: var(--pico-del-color);">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
            <label>Почта<input name="email" required autofocus></label>
            <label>Пароль<input type="password" name="password" required></label>
            <button type="submit">Войти</button>
        </form>
    </article>
</main>
</body>
</html>
