[project]
name = "eurovision-analysis"
version = "0.1.0"
description = "Eurovision opinions and analytics app"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.ruff]
line-length = 100
